version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialblog-api
    ports:
      - "5228:80"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=socialblog;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - socialblog-network
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: socialblog-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=socialblog
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - socialblog-network
    restart: unless-stopped

networks:
  socialblog-network:
    driver: bridge

volumes:
  postgres-data:
